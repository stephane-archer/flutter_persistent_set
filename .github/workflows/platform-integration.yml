name: Platform integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-version-checks:
    name: Analyze and test (minimum Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  stable-version-checks:
    name: Analyze and test (current stable Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  macos:
    name: macOS migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate macOS test host
        working-directory: example
        run: flutter create --platforms=macos .

      - name: Run migration test
        working-directory: example
        run: flutter test integration_test/persistence_migration_test.dart -d macos

  ios:
    name: iOS migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate iOS test host
        working-directory: example
        run: flutter create --platforms=ios .

      - name: Start iOS simulator
        shell: bash
        run: |
          IOS_SIMULATOR_UDID="$(xcrun simctl list devices available -j | jq -r '
            (.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"] // [])
            | map(select(.name | startswith("iPhone")))
            | first
            | .udid // empty
          ')"
          if [[ -z "$IOS_SIMULATOR_UDID" || "$IOS_SIMULATOR_UDID" == "null" ]]; then
            echo "No available iOS 18.5 simulator found."
            exit 1
          fi
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b

      - name: Run migration test
        working-directory: example
        timeout-minutes: 10
        run: flutter test integration_test/persistence_migration_test.dart -d "$IOS_SIMULATOR_UDID"

  android:
    name: Android migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Android test host
        working-directory: example
        run: flutter create --platforms=android .

      - name: Run migration test
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          working-directory: example
          script: flutter test integration_test/persistence_migration_test.dart -d emulator-5554

  linux:
    name: Linux migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libgtk-3-dev ninja-build pkg-config xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Linux test host
        working-directory: example
        run: flutter create --platforms=linux .

      - name: Run migration test
        working-directory: example
        run: xvfb-run -a flutter test integration_test/persistence_migration_test.dart -d linux

  web:
    name: Web migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate web test host
        working-directory: example
        run: flutter create --platforms=web .

      - name: Run migration test
        working-directory: example
        shell: bash
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          timeout 5m flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/persistence_migration_test.dart \
            --headless \
            -d web-server

  windows:
    name: Windows migration
    needs:
      - minimum-version-checks
      - stable-version-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Windows test host
        working-directory: example
        run: flutter create --platforms=windows .

      - name: Run migration test
        working-directory: example
        run: flutter test integration_test/persistence_migration_test.dart -d windows

  release-gate:
    name: Release gate
    needs:
      - minimum-version-checks
      - stable-version-checks
      - macos
      - ios
      - android
      - linux
      - web
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        run: echo "Unit and platform migration checks passed."
